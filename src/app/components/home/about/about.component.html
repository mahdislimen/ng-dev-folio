<div id="about" class="my-12 lg:my-16 relative">
    <div class="hidden lg:flex flex-col items-center absolute top-16 -right-8">
        <span class="bg-[#1a1443] w-fit text-white rotate-90 p-2 px-5 text-xl rounded-md">
            ABOUT ME
        </span>
        <span class="h-36 w-[2px] bg-[#1a1443]"></span>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16">
        <div class="order-2 lg:order-1">
            <p class="font-medium mb-5 text-[#16f2b3] text-xl uppercase">
                Who I am?
            </p>
            <p class="text-gray-200 text-sm lg:text-lg">
                {{ personalData.description }}
            </p>
        </div>
        <div class="flex justify-center items-start order-1 lg:order-2 
            h-[300px] min-h-[300px] 
            lg:h-[340px] lg:min-h-[340px]">

            <img [src]="personalData.profile" alt="Mahdi Slimen - Software Engineer" class="rounded-lg 
               transition-all duration-1000 
               grayscale hover:grayscale-0 hover:scale-105 
               cursor-pointer 
               w-[300px] h-[300px] 
               lg:w-[340px] lg:h-[340px] 
               object-cover" />

        </div>
    </div>
</div>
